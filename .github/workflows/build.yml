name: Compilar APK
on:
  workflow_dispatch:
  push:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug
      - run: gradle :app:testNormalDebugUnitTest
        env:
          SORTEOS_CLAVE: ${{ secrets.SORTEOS_CLAVE }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}  # clave de Apify para cargar los comentarios de golpe  # clave de los códigos de Sorteos Star (Ajustes → Secrets → Actions)
      - name: Sorteos Star para Google Play (.aab firmado)
        env:
          PLAY_UPLOAD_PASS: ${{ secrets.PLAY_UPLOAD_PASS }}  # contraseña de la clave de subida de Google Play
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          if [ -n "$PLAY_UPLOAD_PASS" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in sorteosplay/upload.jks.enc -out sorteosplay/upload.jks -pass env:PLAY_UPLOAD_PASS
            gradle :sorteosplay:bundleRelease
            cp sorteosplay/build/outputs/bundle/release/*.aab SorteosStar-GooglePlay.aab
            rm -f sorteosplay/upload.jks
          else
            echo "Falta el secreto PLAY_UPLOAD_PASS: el .aab se compila sin firmar (solo para comprobar) y no se publica"
            gradle :sorteosplay:bundleRelease
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: StarApp-apk
          path: app/build/outputs/apk/*/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: StarAppSencilla-apk
          path: app/build/outputs/apk/sencilla/debug/*.apk
      - name: Publicar los APK en la Release «ultima» (descarga directa desde el móvil)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ultima >/dev/null 2>&1 || gh release create ultima --title "Última versión" --notes "APK de la última compilación (se sustituye en cada compilación)." --prerelease
          for f in app/build/outputs/apk/*/debug/*.apk; do
            flavor=$(echo "$f" | cut -d/ -f5)
            cp "$f" "$flavor-$(basename "$f")"
          done
          gh release upload ultima *-*.apk --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: MiMundo-juego-apk
          path: juego/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MiMundoLengua-apk
          path: lengua/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MiMundoMates-apk
          path: mates/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MiMundoCono-apk
          path: cono/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MiMundoFacil-apk
          path: facil/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MiMundoPasoAPaso-apk
          path: pasoapaso/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MiMundoIngles-apk
          path: ingles/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MiMundoInglesFacil-apk
          path: inglesfacil/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Gatidoku-apk
          path: gatidoku/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: StarJoyas-apk
          path: joyas/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: StarMates-apk
          path: calculo/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: StarTeclado-apk
          path: teclado/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MiMundoLetras-apk
          path: letrasmundo/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CaminandoLetras-apk
          path: letras/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AcentosPalabras-apk
          path: acentos/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SorteosStar-apk
          path: sorteos/build/outputs/apk/debug/*.apk
      - run: cp app/build/outputs/apk/normal/debug/app-normal-debug.apk StarApp.apk && cp StarApp.apk app-debug.apk && cp app/build/outputs/apk/historias/debug/app-historias-debug.apk StarAppHistorias.apk && cp app/build/outputs/apk/sencilla/debug/app-sencilla-debug.apk StarAppSencilla.apk  # Star App (también como app-debug.apk, el enlace de siempre), Star App Historias y Star App Sencilla
      - run: cp lengua/src/main/assets/mundo.html MiMundo_Lengua_Tema3.html && cp facil/src/main/assets/mundo.html MiMundo_Facil_Tema3.html && cp pasoapaso/src/main/assets/mundo.html MiMundo_PasoAPaso_Tema3.html && cp ingles/src/main/assets/mundo.html MiMundo_Ingles_Unit2.html && cp inglesfacil/src/main/assets/mundo.html MiMundo_InglesFacil_Unit2.html && cp mates/src/main/assets/mundo.html MiMundo_Mates_Tema3.html && cp cono/src/main/assets/mundo.html MiMundo_Cono_Tema3.html && cp sorteos/src/main/assets/sorteos.html SorteosStar.html && cp joyas/src/main/assets/joyas.html StarJoyas.html && cp calculo/src/main/assets/mates.html StarMates.html && cp letras/src/main/assets/letras.html CaminandoLetras.html && cp letrasmundo/src/main/assets/mundo.html MiMundo_Letras.html && cp acentos/src/main/assets/acentos.html LlanasYAgudas.html  # versiones HTML para descargar
      - run: mkdir -p web/ingles && cp lengua/src/main/assets/mundo.html web/index.html && mkdir -p web/sorteos && cp sorteos/src/main/assets/sorteos.html web/sorteos/index.html && cp sorteosplay/privacidad.html web/sorteos/privacidad.html && cp ingles/src/main/assets/mundo.html web/ingles/index.html && mkdir -p web/mates && cp mates/src/main/assets/mundo.html web/mates/index.html && mkdir -p web/cono && cp cono/src/main/assets/mundo.html web/cono/index.html && mkdir -p web/joyas && cp joyas/src/main/assets/joyas.html web/joyas/index.html && mkdir -p web/calculo && cp calculo/src/main/assets/mates.html web/calculo/index.html && mkdir -p web/letras && cp letras/src/main/assets/letras.html web/letras/index.html && touch web/.nojekyll  # páginas web de los juegos (/ = Lengua, /ingles/ = Inglés, /sorteos/ = Sorteos Star, /joyas/ = Star Joyas)
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          publish_branch: gh-pages
          force_orphan: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima-version
          name: Star App y juegos (última versión)
          body: |
            Siete apps distintas, se actualizan con cada compilación:
            - StarApp.apk → Star App
            - app-debug.apk → la misma Star App (con el nombre de antes, para que el enlace de siempre siga funcionando)
            - StarAppHistorias.apk → Star App Historias (otra app, igual que Star App pero además con el paso «historia»: sube la publicación a tu historia y etiqueta a la cuenta)
            - StarAppSencilla.apk → Star App Sencilla (otra app con una sola pantalla: pones el enlace y tus menciones, y lo demás va solo: seguir, me gusta, seguir cuentas de la descripción, comentar, mirar historias y cambiar de cuenta)
            - MiMundo-debug.apk → Mi Mundo (juego: avatar, mascota y preguntas)
            - MiMundoLengua-debug.apk → Mi Mundo Lengua (el mismo juego con el Tema 3 de Lengua)
            - MiMundo_Lengua_Tema3.html → Mi Mundo Lengua para abrir en el navegador
            - MiMundoMates-debug.apk → Mi Mundo Mates (Tema 3 de Matemáticas: la multiplicación, con pizarra para hacer cuentas)
            - MiMundo_Mates_Tema3.html → Mi Mundo Mates para abrir en el navegador
            - MiMundoCono-debug.apk → Mi Mundo Cono (Tema 3 de Conocimiento del Medio: la materia y las fuerzas)
            - MiMundo_Cono_Tema3.html → Mi Mundo Cono para abrir en el navegador
            - MiMundoFacil-debug.apk → Mi Mundo Fácil (Tema 3 de Lengua adaptado para leer mejor: dislexia)
            - MiMundo_Facil_Tema3.html → Mi Mundo Fácil para abrir en el navegador
            - MiMundoPasoAPaso-debug.apk → Mi Mundo Paso a Paso (Tema 3 de Lengua para TDAH, autismo y dislexia: plan visual, rondas de 5, avisos, modo tranquilo y rincón de calma)
            - MiMundo_PasoAPaso_Tema3.html → Mi Mundo Paso a Paso para abrir en el navegador
            - Gatidoku-debug.apk → Gatidoku (puzles de lógica con gatos)
            - MiMundoIngles-debug.apk → Mi Mundo Inglés (el mismo juego con la Unit 2 de inglés «Helping at home», con voz en inglés)
            - MiMundo_Ingles_Unit2.html → Mi Mundo Inglés para abrir en el navegador
            - MiMundoInglesFacil-debug.apk → Inglés Fácil (Unit 2 adaptada para dislexia)
            - MiMundo_InglesFacil_Unit2.html → Inglés Fácil para abrir en el navegador
            - SorteosStar-debug.apk → Sorteos Star (sorteos de Instagram y TikTok para tiendas: pegas el enlace y recoge los comentarios)
            - SorteosStar.html → Sorteos Star para abrir en el navegador (ahí los comentarios se pegan a mano)
            - SorteosStar-GooglePlay.aab → Sorteos Star para subir a Google Play (firmado con la clave de subida)
            - StarJoyas-debug.apk → Star Joyas (juego de unir 3 joyas: niveles, estrellas, combos y regalo diario)
            - StarJoyas.html → Star Joyas para abrir en el navegador
            - StarMates-debug.apk → Star Mates (matemáticas: sumas, restas, multiplicar, dividir, tablas con medallas y reto de 1 minuto)
            - StarMates.html → Star Mates para abrir en el navegador
            - CaminandoLetras-debug.apk → Caminando Letras (lectoescritura para 5 años: vocales, m, p, l, s, t, d, n, ñ y j; escribir con el dedo, sílabas y palabras)
            - CaminandoLetras.html → Caminando Letras para abrir en el navegador
            - MiMundoLetras-debug.apk → Mi Mundo Letras (mascota, avatar, monedas y tienda con preguntas de letras para 5 años: la letra que falta, sílabas, leer, escribir letras y formar palabras)
            - MiMundo_Letras.html → Mi Mundo Letras para abrir en el navegador
            - AcentosPalabras-debug.apk → Llanas y Agudas (juego de Navidad: aprender, 19 juegos y lista de 100 agudas, 100 llanas y 100 esdrújulas)
            - LlanasYAgudas.html → Llanas y Agudas para abrir en el navegador
            - StarTeclado-debug.apk → Star Teclado (teclado con letras bonitas: 27 fuentes, 10 colores, foto de fondo y convertidor para copiar)
          files: |
            StarApp.apk
            app-debug.apk
            StarAppHistorias.apk
            StarAppSencilla.apk
            juego/build/outputs/apk/debug/*.apk
            lengua/build/outputs/apk/debug/*.apk
            mates/build/outputs/apk/debug/*.apk
            cono/build/outputs/apk/debug/*.apk
            facil/build/outputs/apk/debug/*.apk
            pasoapaso/build/outputs/apk/debug/*.apk
            gatidoku/build/outputs/apk/debug/*.apk
            ingles/build/outputs/apk/debug/*.apk
            inglesfacil/build/outputs/apk/debug/*.apk
            sorteos/build/outputs/apk/debug/*.apk
            joyas/build/outputs/apk/debug/*.apk
            calculo/build/outputs/apk/debug/*.apk
            teclado/build/outputs/apk/debug/*.apk
            letras/build/outputs/apk/debug/*.apk
            CaminandoLetras.html
            letrasmundo/build/outputs/apk/debug/*.apk
            MiMundo_Letras.html
            acentos/build/outputs/apk/debug/*.apk
            LlanasYAgudas.html
            StarJoyas.html
            StarMates.html
            MiMundo_Lengua_Tema3.html
            MiMundo_Mates_Tema3.html
            MiMundo_Cono_Tema3.html
            MiMundo_Facil_Tema3.html
            MiMundo_PasoAPaso_Tema3.html
            MiMundo_Ingles_Unit2.html
            MiMundo_InglesFacil_Unit2.html
            SorteosStar.html
            SorteosStar-GooglePlay.aab
