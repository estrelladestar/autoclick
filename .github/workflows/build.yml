name: Compilar APK
on:
  workflow_dispatch:
  push:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: StarApp-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MiMundo-juego-apk
          path: juego/build/outputs/apk/debug/*.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima-version
          name: AutoClick Imagen (última versión)
          body: |
            Dos apps distintas, se actualizan con cada compilación:
            - app-debug.apk → Star App (autoclick)
            - MiMundo-debug.apk → Mi Mundo (juego: avatar, mascota y preguntas)
          files: |
            app/build/outputs/apk/debug/*.apk
            juego/build/outputs/apk/debug/*.apk
