<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mi mundo</title>
<style>
:root{--p:#7c4dff;--p2:#ff5fa2;--ink:#2d1b69;--muted:#7a6aa8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:linear-gradient(180deg,#efe6ff 0%,#ffe9f4 100%);min-height:100vh;-webkit-user-select:none;user-select:none}
button{font:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 12px;background:linear-gradient(90deg,#7c4dff,#ff5fa2);color:#fff;box-shadow:0 2px 10px #7c4dff55}
.coins{background:#ffffff33;border-radius:20px;padding:5px 12px;font-weight:900;font-size:19px;white-space:nowrap}
.coins.pop{animation:pop .5s}
.lvl{flex:1;font-weight:800;font-size:14px}
.xpbar{height:7px;background:#ffffff40;border-radius:6px;margin-top:3px;overflow:hidden}
.xpbar i{display:block;height:100%;background:#ffe066;border-radius:6px;transition:width .5s}
.icon{border:0;background:#ffffff33;color:#fff;border-radius:50%;width:38px;height:38px;font-size:18px}
nav{position:sticky;top:58px;z-index:19;display:flex;gap:6px;padding:8px 10px;background:#efe6ffee;backdrop-filter:blur(6px)}
nav button{flex:1;border:0;border-radius:14px;padding:8px 2px;font-weight:800;background:#fff;color:var(--ink);font-size:12.5px;box-shadow:0 2px 0 #0001;line-height:1.2}
nav button b{display:block;font-size:20px}
nav button.on{background:linear-gradient(180deg,#8b5cf6,#6a3de8);color:#fff}
section{display:none;padding:6px 12px 40px}
section.on{display:block}
h2{font-size:17px;margin:16px 2px 8px;color:#6a3de8}
.card{background:#fff;border-radius:20px;padding:12px;box-shadow:0 4px 14px #7c4dff1f;margin-bottom:12px}
.btn{border:0;border-radius:16px;padding:12px 8px;font-weight:800;color:#fff;background:linear-gradient(180deg,#8b5cf6,#6a3de8);font-size:14.5px;box-shadow:0 3px 0 #0002;line-height:1.15}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.pink{background:linear-gradient(180deg,#ff7fb5,#e0307a)}
.btn.blue{background:linear-gradient(180deg,#5cc8ff,#2563eb)}
.btn.orange{background:linear-gradient(180deg,#ffbe4d,#f57c00)}
.btn.green{background:linear-gradient(180deg,#4ade80,#16a34a)}
.btn.teal{background:linear-gradient(180deg,#2dd4bf,#0d9488)}
.btn.red{background:linear-gradient(180deg,#ff8a8a,#dc2626)}
.btn.gray{background:linear-gradient(180deg,#c9c3dd,#9a92b8)}
.btn.big{width:100%;font-size:17px;padding:15px}
.btn[disabled]{opacity:.5}
/* Escena */
.scene{position:relative;height:330px;border-radius:24px;overflow:hidden;box-shadow:0 6px 18px #7c4dff33;background:#fde6f1}
.scene .bgsvg{position:absolute;left:0;top:0;width:100%;height:100%}
.scene .av{position:absolute;left:2%;bottom:4px;height:300px}
.scene .av svg{height:100%;width:auto;display:block}
.scene .pet{position:absolute;right:5%;bottom:6px;width:140px;height:140px}
.scene .pet svg{width:100%;height:100%;display:block}
.scene.night:after{content:"";position:absolute;inset:0;background:#120a3acc;pointer-events:none}
.scene .moon{display:none;position:absolute;left:14px;top:12px;font-size:30px;z-index:3}
.scene.night .moon{display:block}
.bubble{position:absolute;top:12px;right:10px;left:44%;z-index:4;background:#fff;border-radius:18px;padding:10px 12px;font-weight:800;font-size:14.5px;box-shadow:0 4px 12px #0002;min-height:42px}
.bubble:after{content:"";position:absolute;bottom:-11px;right:56px;border:11px solid transparent;border-top-color:#fff;border-bottom:0}
.poops{position:absolute;right:46%;bottom:8px;font-size:28px;z-index:2;letter-spacing:4px}
.fx{position:absolute;z-index:6;pointer-events:none;font-size:30px;animation:rise 1.4s ease-out forwards}
@keyframes rise{0%{opacity:0;transform:translateY(10px) scale(.6)}20%{opacity:1;transform:translateY(0) scale(1.15)}100%{opacity:0;transform:translateY(-70px) scale(1)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes jump{0%,100%{transform:translateY(0) scale(1)}25%{transform:translateY(-46px) scale(1.05,.95)}55%{transform:translateY(0) scale(1.08,.9)}75%{transform:translateY(-12px)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@keyframes chomp{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.3)}}
.pet svg{animation:bob 2.4s ease-in-out infinite;transform-origin:50% 100%}
.pet.jump svg{animation:jump .9s ease}
.pet.wiggle svg{animation:wiggle .5s ease 3}
.pet.sleep svg{animation:bob 4s ease-in-out infinite}
.breathe{animation:breathe 3.6s ease-in-out infinite}
.blinky{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
.chomp{transform-box:fill-box;transform-origin:center;animation:chomp .35s infinite}
/* Barras */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin:12px 2px}
.stat{font-weight:800;font-size:13px}
.stat .bar{height:12px;background:#ece6fb;border-radius:8px;overflow:hidden;margin-top:3px}
.stat .bar i{display:block;height:100%;border-radius:8px;transition:width .6s}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.petname{display:flex;align-items:center;gap:8px;margin:12px 2px 0;font-weight:900;font-size:18px}
.petname button{border:0;background:#fff;border-radius:12px;padding:6px 10px;font-weight:800;color:#6a3de8;box-shadow:0 2px 0 #0001}
/* Preguntas */
.qtop{display:flex;gap:8px;align-items:flex-end;margin-top:6px}
.qpet{width:96px;height:96px;flex:none}
.qpet svg{width:100%;height:100%}
.qbubble{flex:1;position:relative;background:#fff;border-radius:20px;padding:13px 14px;font-weight:800;font-size:17px;box-shadow:0 4px 14px #7c4dff22;min-height:90px;margin-bottom:24px}
.qbubble:after{content:"";position:absolute;left:-10px;bottom:20px;border:10px solid transparent;border-right-color:#fff;border-left:0}
.qbubble small{display:block;font-size:12px;color:var(--muted);font-weight:800;margin-bottom:4px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;border-radius:18px;padding:8px 12px;font-weight:800;background:#fff;color:var(--ink);font-size:13px;box-shadow:0 2px 0 #0001}
.chip.on{background:#ff5fa2;color:#fff}
.opts{display:grid;gap:9px;margin-top:4px}
.opt{border:0;border-radius:16px;padding:14px 12px;font-weight:800;font-size:16px;text-align:left;background:#fff;color:var(--ink);box-shadow:0 3px 0 #7c4dff33;display:flex;gap:10px;align-items:center}
.opt span{flex:none;width:30px;height:30px;border-radius:50%;background:#efe6ff;color:#6a3de8;display:flex;align-items:center;justify-content:center;font-weight:900}
.opt.ok{background:#4ade80;color:#fff}
.opt.ok span{background:#fff;color:#16a34a}
.opt.bad{background:#ff6b6b;color:#fff}
.opt.bad span{background:#fff;color:#dc2626}
.qfoot{display:flex;gap:10px;align-items:center;margin-top:12px}
.qfoot .info{flex:1;font-weight:800;font-size:13px;color:var(--muted)}
/* Avatar */
.avbig{position:sticky;top:122px;z-index:5;height:290px;border-radius:24px;overflow:hidden;box-shadow:0 6px 18px #7c4dff33;background:#fff;display:flex;justify-content:center}
.avbig svg{height:100%;width:auto}
.avbig .full{position:absolute;inset:0;width:100%;height:100%}
.avbig .full svg{width:100%;height:100%;display:block}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.item{position:relative;border:0;background:#fff;border-radius:18px;padding:6px 4px 8px;box-shadow:0 3px 0 #7c4dff22;font-weight:800;font-size:12px;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:3px}
.item .th{width:100%;aspect-ratio:1/1;border-radius:14px;background:linear-gradient(180deg,#f6f0ff,#ffeef7);overflow:hidden;display:flex;align-items:center;justify-content:center}
.item .th svg{width:100%;height:100%}
.item.on{outline:3px solid #ff5fa2}
.item.try{outline:3px dashed #7c4dff}
.item .tag{position:absolute;top:6px;right:6px;background:#ffe066;color:#6b4a00;border-radius:10px;padding:2px 6px;font-size:11px;font-weight:900}
.item .tag.lock{background:#2d1b69;color:#fff}
.item .tag.own{background:#4ade80;color:#fff}
.buybar{position:fixed;left:10px;right:10px;bottom:10px;z-index:30;background:#2d1b69;color:#fff;border-radius:20px;padding:10px 12px;display:none;align-items:center;gap:8px;box-shadow:0 8px 24px #0005}
.buybar.on{display:flex}
.buybar .t{flex:1;font-weight:800;font-size:14px;line-height:1.25}
/* Tienda */
.row{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid #f0eafc}
.row:last-child{border-bottom:0}
.row .e{font-size:32px;width:44px;text-align:center}
.row .t{flex:1;font-weight:800;font-size:14px}
.row .t small{display:block;color:var(--muted);font-weight:700;font-size:12px}
.row .btn{padding:9px 12px;font-size:13.5px}
/* Modal y aviso */
#modal{position:fixed;inset:0;z-index:50;background:#1a0f3d99;display:none;align-items:center;justify-content:center;padding:16px}
#modal.on{display:flex}
#modal .box{background:#fff;border-radius:24px;padding:16px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
#modal h3{margin:2px 0 10px;color:#6a3de8;font-size:19px}
#modal input{width:100%;font:inherit;font-size:17px;font-weight:800;padding:11px 12px;border:2px solid #d9ccff;border-radius:14px;color:var(--ink);margin:6px 0 12px;-webkit-user-select:text;user-select:text}
.species{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.species button{border:0;background:#f6f0ff;border-radius:16px;padding:6px 4px;font-weight:800;font-size:12.5px;color:var(--ink)}
.species button.on{background:#ffe0ef;outline:3px solid #ff5fa2}
.species svg{width:100%;height:auto;display:block}
.two{display:flex;gap:8px}
.two .btn{flex:1}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:60;background:#2d1b69;color:#fff;font-weight:800;padding:10px 16px;border-radius:16px;box-shadow:0 6px 18px #0004;display:none;max-width:90%;text-align:center}
#toast.on{display:block;animation:pop .4s}
.burst{position:fixed;z-index:70;pointer-events:none;font-size:26px;animation:fly 1.3s ease-out forwards}
@keyframes fly{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(260deg)}}
/* Modo pequeño (pantalla principal de la app) */
#mini{display:none}
body.mini{background:transparent;min-height:0;overflow:hidden}
body.mini #app{display:none}
body.mini #mini{display:flex;align-items:center;gap:10px;margin:2px;padding:8px 12px 8px 6px;height:calc(100vh - 4px);border-radius:22px;background:linear-gradient(120deg,#ffffff 0%,#f3ebff 55%,#ffe3f1 100%);box-shadow:0 3px 10px #7c4dff33}
#mini .mpet{width:118px;height:118px;flex:none}
#mini .mpet svg{width:100%;height:100%}
#mini .mtxt{flex:1;font-weight:800;font-size:14px;line-height:1.3}
#mini .mtxt b{color:#6a3de8;font-size:16px}
#mini .msay{display:block;background:#fff;border-radius:14px;padding:6px 9px;margin:4px 0;box-shadow:0 2px 6px #0001}
#mini .mgo{flex:none;width:46px;height:46px;border-radius:50%;background:linear-gradient(180deg,#4ade80,#16a34a);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 #0002}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="coins" id="coinsBox">🪙 <b id="coins">0</b></div>
    <div class="lvl">⭐ Nivel <b id="lvl">1</b><div class="xpbar"><i id="xp"></i></div></div>
    <button class="icon" id="snd" title="Voz">🔊</button>
  </header>
  <nav>
    <button data-t="pet" class="on"><b>🐾</b>Mascota</button>
    <button data-t="quiz"><b>❓</b>Preguntas</button>
    <button data-t="av"><b>👗</b>Avatar</button>
    <button data-t="shop"><b>🛍️</b>Tienda</button>
  </nav>

  <section id="t-pet" class="on">
    <div class="scene" id="scene">
      <div class="moon">🌙</div>
      <div class="bgsvg" id="sceneBg"></div>
      <div class="av" id="sceneAv"></div>
      <div class="poops" id="poops"></div>
      <div class="pet" id="scenePet"></div>
      <div class="bubble" id="bubble">¡Hola!</div>
    </div>
    <div class="petname"><span id="petName">Mascota</span><button id="editPet">✏️ Cambiar</button></div>
    <div class="stats" id="stats"></div>
    <div class="actions" id="actions"></div>
    <button class="btn pink big" style="margin-top:12px" id="goQuiz">❓ ¡Hazme preguntas y gana monedas!</button>
  </section>

  <section id="t-quiz">
    <div class="chips" id="qcats"></div>
    <div class="qtop">
      <div class="qpet" id="qpet"></div>
      <div class="qbubble" id="qtext"></div>
    </div>
    <div class="opts" id="qopts"></div>
    <div class="qfoot"><div class="info" id="qinfo"></div><button class="btn green" id="qnext">Siguiente ▶</button></div>
  </section>

  <section id="t-av">
    <div class="avbig" id="avbig"></div>
    <div class="chips" id="avcats" style="margin-top:8px"></div>
    <div class="grid" id="avgrid"></div>
  </section>

  <section id="t-shop">
    <h2>🍎 Comida y cuidados</h2>
    <div class="card" id="foodList"></div>
    <h2>🎀 Cosas para tu mascota</h2>
    <div class="grid" id="paccGrid"></div>
    <h2>👗 Ropa y accesorios</h2>
    <div class="card" style="font-weight:700">La ropa, los ojos, la boca, el pelo, los accesorios y los fondos se compran en la pestaña <b>Avatar</b>: toca algo para probártelo y luego «Comprar».
      <button class="btn big" style="margin-top:10px" onclick="tab('av')">👗 Ir al Avatar</button></div>
  </section>
</div>

<div id="mini">
  <div class="mpet" id="mpet"></div>
  <div class="mtxt"><b id="mname"></b><span class="msay" id="msay"></span><span id="mcoins"></span></div>
  <div class="mgo">▶</div>
</div>

<div class="buybar" id="buybar"><div class="t" id="buyText"></div><button class="btn green" id="buyBtn">Comprar</button><button class="btn gray" id="buyCancel">✕</button></div>
<div id="modal"><div class="box" id="modalBox"></div></div>
<div id="toast"></div>

<script>
"use strict";
var B = window.MundoApp || null;
var MINI = false;
try { MINI = B && B.isMini ? B.isMini() : location.hash.indexOf('mini') >= 0; } catch (e) {}

/* ======================= utilidades ======================= */
function $(id){ return document.getElementById(id); }
function rnd(n){ return Math.floor(Math.random() * n); }
function pick(a){ return a[rnd(a.length)]; }
function shuffle(a){ a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = rnd(i + 1), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function clamp(v){ return Math.max(0, Math.min(100, v)); }
function shade(hex, p){
  var n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  function f(c){ return Math.max(0, Math.min(255, Math.round(p < 0 ? c * (1 + p / 100) : c + (255 - c) * p / 100))); }
  return '#' + ((1 << 24) | (f(r) << 16) | (f(g) << 8) | f(b)).toString(16).slice(1);
}
function star(cx, cy, R, r, fill, extra){
  var pts = [];
  for (var i = 0; i < 10; i++) {
    var a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r : R;
    pts.push((cx + rr * Math.cos(a)).toFixed(1) + ',' + (cy + rr * Math.sin(a)).toFixed(1));
  }
  return '<polygon points="' + pts.join(' ') + '" fill="' + fill + '" ' + (extra || '') + '/>';
}
function heart(cx, cy, s){
  return 'M' + cx + ',' + (cy + s * .9) + ' C' + (cx - s * 1.6) + ',' + (cy - s * .2) + ' ' + (cx - s * .8) + ',' + (cy - s * 1.3) + ' ' + cx + ',' + (cy - s * .5) +
    ' C' + (cx + s * .8) + ',' + (cy - s * 1.3) + ' ' + (cx + s * 1.6) + ',' + (cy - s * .2) + ' ' + cx + ',' + (cy + s * .9) + ' Z';
}
var MIRROR = 'transform="translate(200,0) scale(-1,1)"';
function today(){ var d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }

/* ======================= catálogo ======================= */

  {id:'shoes', n:'Zapatos',    e:'👟', crop:'62 282 76 56'},
  {id:'head',  n:'Cabeza',     e:'👑', crop:'18 -22 164 164'},
  {id:'face',  n:'Cara',       e:'🕶️', crop:'40 62 120 80'},
  {id:'neck',  n:'Cuello',     e:'📿', crop:'56 126 88 88'},
  {id:'hand',  n:'En la mano', e:'🪄', crop:'92 92 96 176'},
  {id:'back',  n:'Espalda',    e:'🦋', crop:'0 96 200 236'},
  {id:'bg',    n:'Fondo',      e:'🏞️', crop:'0 -20 200 360'}
];
/* [id, nombre, precio] */
var ITEMS = {
  skin:[['s1','Muy clara',0],['s2','Clara',0],['s3','Dorada',0],['s4','Morena',0],['s5','Oscura',0],['s6','Muy oscura',0]],
  hair:[['largo','Largo',0],['corto','Corto',0],['flequillo','Media melena',0],['coletas','Coletas',30],['cola','Cola de caballo',35],['mono','Moño',30],['rizos','Rizos',40],['pinchos','Pinchos',40],['trenzas','Trenzas',50],['ondas','Ondas de princesa',60]],

  eyes:[['grandes','Grandes',0],['redondos','Redondos',0],['alegres','Alegres',0],['gato','De gatita',30],['dormilones','Dormilones',30],['guino','Guiño',40],['brillo','Con brillo',40],['estrellas','Estrellas',60],['corazon','Corazones',60]],
  ecol:[['cafe','Café',0],['azul','Azul',0],['verde','Verde',0],['miel','Miel',20],['gris','Gris',20],['violeta','Violeta',40],['turquesa','Turquesa',40],['rubi','Rubí',50]],

function updatePet(){

    while (p.pooAcc >= 3) { p.pooAcc -= 3; if ((p.poops || 0) < 3) p.poops = (p.poops || 0) + 1; }

function action(a){
  var p = S.pet, host = $('scene');
  if (p.sleeping && a !== 'sleep') { say('Zzz… Primero despiértame ☀️'); return; }
  switch (a) {
    case 'feed': openFood(); return;
    case 'play':
      if (p.energy < 15) { say('Estoy muy cansado para jugar… ¿me acuestas? 💤'); return; }
      p.happy = clamp(p.happy + 15); p.energy = clamp(p.energy - 10); p.hunger = clamp(p.hunger - 4);
      anim('jump'); fx(host, pick(['🎾', '⚽', '🪀', '🎈']), '62%', '150px');
      setTempMood('celebra'); say(pick(['¡Yupiii! ¡Otra vez! 🎾', '¡Qué divertido! 😄', '¡Me encanta jugar contigo! 💜']));
      break;
    case 'bath':
      p.clean = 100; p.happy = clamp(p.happy + 5);
      anim('wiggle'); fx(host, '💦', '70%', '140px'); fx(host, '✨', '82%', '90px');
      setTempMood('comer'); say(pick(['¡Splash! Ahora huelo genial ✨', '¡Qué limpito estoy! 🛁']));

    case 'sleep':
      p.sleeping = !p.sleeping;
      say(p.sleeping ? 'Buenas noches… 😴' : '¡Buenos días! ☀️ ¿Jugamos?');
      break;
    case 'clean':
      if (!p.poops) { say('¡Todo está limpio! ✨'); return; }
      p.poops = 0; p.clean = clamp(p.clean + 10); fx(host, '✨', '50%', '20px');
      say('¡Gracias por limpiar! 🧹');
      break;
    case 'cure':
      if (!p.sick) { say('¡Estoy sano como una manzana! 🍎'); return; }
      if (!S.food.medicina) { say('Necesito una medicina 💊. La tienes en la Tienda.'); return; }
      S.food.medicina--; p.sick = false; p.happy = clamp(p.happy + 5);
      p.hunger = Math.max(p.hunger, 20); p.clean = Math.max(p.clean, 20);
      setTempMood('celebra'); say('¡Ya me encuentro mucho mejor! Gracias 💜');
      break;
  }
  save(); renderPet();
}

}

function mathQ(){
  var t = rnd(4), a, b, ans, txt;
  if (t === 0) { a = 5 + rnd(56); b = 5 + rnd(56); ans = a + b; txt = '¿Cuánto es ' + a + ' + ' + b + '?'; }
  else if (t === 1) { a = 20 + rnd(80); b = 1 + rnd(a); ans = a - b; txt = '¿Cuánto es ' + a + ' − ' + b + '?'; }
  else if (t === 2) { a = 2 + rnd(9); b = 2 + rnd(9); ans = a * b; txt = '¿Cuánto es ' + a + ' × ' + b + '?'; }
  else { b = 2 + rnd(9); ans = 2 + rnd(9); a = b * ans; txt = '¿Cuánto es ' + a + ' ÷ ' + b + '?'; }
  var w = {}, opts = [];
  while (opts.length < 3) {
    var d = ans + (rnd(2) ? 1 : -1) * (1 + rnd(t === 2 ? 10 : 6));
    if (d >= 0 && d !== ans && !w[d]) { w[d] = 1; opts.push(String(d)); }
  }
  return {cat:'mates', q:txt, ok:String(ans), opts:shuffle([String(ans)].concat(opts))};
}
var curQ = null, answered = false, quizMood = null;
function nextQuestion(){
  answered = false; quizMood = null;
  if (S.pet && S.pet.sleeping) {
    $('qtext').innerHTML = 'Zzz… 😴 Estoy dormido. Despiértame en la pestaña Mascota para jugar.';
    $('qopts').innerHTML = '<button class="btn blue big" onclick="wakeAndPlay()">☀️ Despertar y jugar</button>';
    renderPetViews(); return;
  }
  var cat = S.qcat || 'todas', q;
  if (cat === 'mates' || (cat === 'todas' && rnd(7) === 0)) q = mathQ();
  else {
    var pool = [];
    for (var i = 0; i < Q.length; i++) if ((cat === 'todas' || Q[i][0] === cat) && S.recent.indexOf(i) < 0) pool.push(i);
    if (!pool.length) {
      S.recent = S.recent.filter(function(i){ return cat !== 'todas' && Q[i][0] !== cat; });
      for (var j = 0; j < Q.length; j++) if (cat === 'todas' || Q[j][0] === cat) pool.push(j);
    }
    var k = pick(pool); S.recent.push(k); if (S.recent.length > 80) S.recent.shift();
    var r = Q[k];
    q = {cat:r[0], q:r[1], ok:r[2], opts:shuffle(r.slice(2, 6))};
  }
  curQ = q;
  var catName = QCATS.filter(function(c){ return c[0] === q.cat; })[0];
  $('qtext').innerHTML = '<small>' + (catName ? catName[1] : '') + ' · ' + (S.pet ? S.pet.name : '') + ' pregunta:</small>' + q.q;
  $('qopts').innerHTML = q.opts.map(function(o, i){ return '<button class="opt" data-o="' + i + '"><span>' + 'ABCD'[i] + '</span>' + o + '</button>'; }).join('');
  $('qnext').style.visibility = 'hidden';
  renderQInfo(); renderPetViews(); save();
  speak(q.q);
}
function wakeAndPlay(){ S.pet.sleeping = false; save(); renderPet(); nextQuestion(); }
function answer(i){
  if (answered || !curQ) return;
  answered = true;
  var btns = $('qopts').querySelectorAll('.opt'), chosen = curQ.opts[i], good = chosen === curQ.ok;
  for (var k = 0; k < btns.length; k++) if (curQ.opts[k] === curQ.ok) btns[k].classList.add('ok');
  S.stats.answered++;
  if (S.pet) { S.pet.happy = clamp(S.pet.happy + (good ? 3 : 1)); S.pet.energy = clamp(S.pet.energy - .5); }
  if (good) {
    S.stats.correct++; S.stats.streak++; S.stats.best = Math.max(S.stats.best, S.stats.streak);
    var bonus = S.stats.streak % 5 === 0 ? 15 : 0, earn = 10 + bonus;
    quizMood = 'celebra';
    var msg = pick(['¡Muy bien!', '¡Correcto!', '¡Genial!', '¡Eres un crack!', '¡Lo sabías!']) + ' +' + earn + ' 🪙' + (bonus ? ' (¡racha de ' + S.stats.streak + '!)' : '');
    $('qtext').innerHTML = '<small>✅ ' + curQ.q + '</small>' + msg;
    speak(msg.replace('+', 'más ').replace('🪙', 'monedas'));
    var r = btns[i].getBoundingClientRect(); burst(bonus ? ['🪙', '⭐', '🎉'] : ['🪙', '✨'], r.left + r.width / 2, r.top);
    vibrate(40);
    addCoins(earn); addXp(10);
  } else {
    btns[i].classList.add('bad'); S.stats.streak = 0; quizMood = 'triste';
    var m2 = '¡Casi! La respuesta era: ' + curQ.ok + '. ¡La próxima seguro que sí! (+1 🪙)';
    $('qtext').innerHTML = '<small>❌ ' + curQ.q + '</small>' + m2;
    speak('¡Casi! La respuesta era: ' + curQ.ok);
    vibrate(120);
    addCoins(1); addXp(3);
  }
  renderPetViews(); renderQInfo(); save();
  $('qnext').style.visibility = 'visible';
}
function renderQInfo(){
  var st = S.stats;
  $('qinfo').innerHTML = '✅ ' + st.correct + ' aciertos · 🔥 racha ' + st.streak + ' · 🏆 mejor ' + st.best;
}
function renderQCats(){
  $('qcats').innerHTML = QCATS.map(function(c){ return '<button class="chip' + (S.qcat === c[0] ? ' on' : '') + '" data-c="' + c[0] + '">' + c[1] + '</button>'; }).join('');
}

/* ======================= avatar y tienda ======================= */
var avCat = 'hair', trying = null;
function renderAvCats(){
  $('avcats').innerHTML = CATS.map(function(c){ return '<button class="chip' + (avCat === c.id ? ' on' : '') + '" data-c="' + c.id + '">' + c.e + ' ' + c.n + '</button>'; }).join('');
}
function previewEq(){ var e = Object.assign({}, S.eq); if (trying) e[trying.cat] = trying.id; return e; }
function renderAvBig(){
  var e = previewEq();
  $('avbig').innerHTML = '<div class="full">' + bgOnlySVG(e.bg, 'xMidYMid slice') + '</div><div style="position:relative;height:100%">' + avatarSVG(e, {bg:false, anim:true, vb:'10 -20 180 360'}) + '</div>';
}
function renderAvGrid(){
  var cat = CATS.filter(function(c){ return c.id === avCat; })[0];
  var cur = previewEq();
  $('avgrid').innerHTML = ITEMS[avCat].map(function(it){
    var e = Object.assign({}, S.eq); e[avCat] = it[0];
    if (avCat === 'bottom' && isDress(e.top)) e.top = 'cam_rosa';
    var own = owns(avCat, it[0]), on = S.eq[avCat] === it[0], tr = trying && trying.cat === avCat && trying.id === it[0];
    var th = avCat === 'bg' ? bgOnlySVG(it[0], 'xMidYMid slice') : (it[0] === 'none' ? '<div style="font-size:30px">🚫</div>' : avatarSVG(e, {vb:cat.crop, bg:false}));
    var tag = on ? '<span class="tag own">✓</span>' : (own ? '' : '<span class="tag' + (S.coins < it[2] ? ' lock' : '') + '">🪙 ' + it[2] + '</span>');
    return '<button class="item' + (on ? ' on' : '') + (tr ? ' try' : '') + '" data-i="' + it[0] + '"><div class="th">' + th + '</div>' + it[1] + tag + '</button>';
  }).join('');
}
function renderAv(){ renderAvCats(); renderAvBig(); renderAvGrid(); renderBuyBar(); }
function tapItem(id){
  if (owns(avCat, id)) {
    S.eq[avCat] = id; trying = null; save();
    if (avCat === 'top' && isDress(id)) toast('👗 Con vestido no se ve la parte de abajo');
  } else {
    trying = {cat:avCat, id:id};
  }
  renderAv(); renderPet();
}
function itemInfo(cat, id){ var l = cat === 'pacc' ? PACC : ITEMS[cat]; for (var i = 0; i < l.length; i++) if (l[i][0] === id) return l[i]; return null; }
function renderBuyBar(){
  var bar = $('buybar');
  if (!trying || !$('t-av').classList.contains('on')) { bar.classList.remove('on'); return; }
  var it = itemInfo(trying.cat, trying.id);
  if (S.coins >= it[2]) {
    $('buyText').innerHTML = 'Probando: <b>' + it[1] + '</b><br>🪙 ' + it[2] + ' monedas';
    $('buyBtn').textContent = 'Comprar'; $('buyBtn').className = 'btn green'; $('buyBtn').dataset.m = 'buy';
  } else {
    $('buyText').innerHTML = '<b>' + it[1] + '</b> cuesta 🪙 ' + it[2] + '.<br>Te faltan ' + (it[2] - S.coins) + '. ¡Responde preguntas!';
    $('buyBtn').textContent = '❓ Jugar'; $('buyBtn').className = 'btn pink'; $('buyBtn').dataset.m = 'quiz';
  }
  bar.classList.add('on');
}
function buyTrying(){
  var it = itemInfo(trying.cat, trying.id);
  if (S.coins < it[2]) return;
  S.coins -= it[2]; S.owned[trying.cat + ':' + trying.id] = true; S.eq[trying.cat] = trying.id;
  var cat = trying.cat; trying = null; save(); renderHeader(); renderAv(); renderPet();
  burst(['✨', '💖', '⭐']); toast('¡Comprado: ' + it[1] + '! 🎉');
  if (S.pet) speak(pick(['¡Te queda genial!', '¡Qué guapo te ves!', '¡Me encanta!']));
  if (cat === 'top' && isDress(S.eq.top)) toast('👗 Con vestido no se ve la parte de abajo');
}
function renderShop(){
  $('foodList').innerHTML = FOOD.map(function(f){
    return '<div class="row"><div class="e">' + f.e + '</div><div class="t">' + f.n + '<small>' + (f.med ? 'Cura a tu mascota si se pone malita' : 'Comida +' + f.hunger + (f.happy ? ' · Felicidad +' + f.happy : '') + (f.energy ? ' · Energía +' + f.energy : '')) + ' · tienes ' + (S.food[f.id] || 0) + '</small></div><button class="btn ' + (S.coins >= f.p ? 'orange' : 'gray') + '" data-f="' + f.id + '">🪙 ' + f.p + '</button></div>';
  }).join('');
  if (!S.pet) { $('paccGrid').innerHTML = ''; return; }
  $('paccGrid').innerHTML = PACC.map(function(a){
    var own = owns('pacc', a[0]), on = (S.pet.acc || 'none') === a[0];
    var th = a[0] === 'none' ? '<div style="font-size:30px">🚫</div>' : petSVG(S.pet, 'normal', a[0]);
    var tag = on ? '<span class="tag own">✓</span>' : (own ? '' : '<span class="tag' + (S.coins < a[2] ? ' lock' : '') + '">🪙 ' + a[2] + '</span>');
    return '<button class="item' + (on ? ' on' : '') + '" data-p="' + a[0] + '"><div class="th">' + th + '</div>' + a[1] + tag + '</button>';
  }).join('');
}
function buyFood(id){
  var f = FOOD.filter(function(x){ return x.id === id; })[0];
  if (S.coins < f.p) { toast('Te faltan ' + (f.p - S.coins) + ' 🪙. ¡Responde preguntas!'); return; }
  S.coins -= f.p; S.food[id] = (S.food[id] || 0) + 1; save(); renderHeader(); renderShop();
  toast(f.e + ' ¡Comprado! Tienes ' + S.food[id]);
}
function tapPacc(id){
  var a = itemInfo('pacc', id);
  if (!owns('pacc', id)) {
    if (S.coins < a[2]) { toast('Te faltan ' + (a[2] - S.coins) + ' 🪙. ¡Responde preguntas!'); return; }
    S.coins -= a[2]; S.owned['pacc:' + id] = true; toast('¡Comprado: ' + a[1] + '! 🎉'); burst(['✨', '💖']);
  }
  S.pet.acc = id; save(); renderHeader(); renderShop(); renderPet();
}

/* ======================= adopción ======================= */
var chooseSp = 'gato';
function openAdopt(first){
  chooseSp = S.pet ? S.pet.sp : 'gato';
  var nm = S.pet ? S.pet.name : SPECIES[chooseSp].name;
  var h = '<h3>' + (first ? '🥚 ¡Elige tu mascota!' : '✏️ Tu mascota') + '</h3>' +
    (first ? '<p style="margin:0 0 10px;font-weight:700">Vivirá contigo, te hará las preguntas y tendrás que cuidarla: darle de comer, bañarla, jugar y acostarla.</p>' : '') +
    '<div class="species" id="spGrid"></div><b>Nombre:</b><input id="petNameIn" maxlength="16" value="' + nm.replace(/"/g, '') + '">' +
    '<div class="two"><button class="btn green" onclick="adopt(' + (first ? 'true' : 'false') + ')">' + (first ? '💜 ¡Adoptar!' : '💾 Guardar') + '</button>' + (first ? '' : '<button class="btn gray" onclick="closeModal()">Cancelar</button>') + '</div>';
  showModal(h); renderSp();
}
function renderSp(){
  var g = $('spGrid'); if (!g) return;
  g.innerHTML = Object.keys(SPECIES).map(function(k){ return '<button class="' + (k === chooseSp ? 'on' : '') + '" data-s="' + k + '">' + petSVG({sp:k}, 'normal', 'none') + SPECIES[k].n + '</button>'; }).join('');
}
function adopt(first){
  var name = ($('petNameIn').value || '').trim() || SPECIES[chooseSp].name;
  if (first || !S.pet) S.pet = {sp:chooseSp, name:name, hunger:80, happy:85, energy:80, clean:90, sleeping:false, poops:0, pooAcc:0, sick:false, last:Date.now(), acc:'none'};
  else { S.pet.sp = chooseSp; S.pet.name = name; }
  save(); closeModal(); renderAll();
  say(first ? '¡Hola! Soy ' + name + '. ¡Hazme caso y juguemos a preguntas para ganar monedas! 🪙' : '¡Me encanta mi nombre! 💜');
}

/* ======================= modal y pestañas ======================= */
function showModal(h){ $('modalBox').innerHTML = h; $('modal').classList.add('on'); }
function closeModal(){ $('modal').classList.remove('on'); }
var curTab = 'pet';
function tab(t){
  curTab = t;
  var bs = document.querySelectorAll('nav button');
  for (var i = 0; i < bs.length; i++) bs[i].classList.toggle('on', bs[i].dataset.t === t);
  ['pet', 'quiz', 'av', 'shop'].forEach(function(x){ $('t-' + x).classList.toggle('on', x === t); });
  if (t !== 'av') trying = null;
  window.scrollTo(0, 0);
  if (t === 'pet') { renderPet(); say(moodPhrase()); }
  if (t === 'quiz') { renderQCats(); if (!curQ || answered) nextQuestion(); else renderPetViews(); }
  if (t === 'av') renderAv();
  if (t === 'shop') renderShop();
  renderBuyBar();
}
function renderAll(){ renderHeader(); renderPet(); if (curTab === 'av') renderAv(); if (curTab === 'shop') renderShop(); }

/* ======================= modo pequeño ======================= */
function renderMini(){
  if (!S.pet) {
    $('mpet').innerHTML = '<div style="font-size:70px;text-align:center;line-height:118px">🥚</div>';
    $('mname').textContent = '¡Tu mascota te espera!';
    $('msay').textContent = 'Toca aquí para adoptarla, crear tu avatar y ganar monedas con preguntas.';
    $('mcoins').textContent = '';
    return;
  }
  updatePet();
  var m = petMood();
  $('mpet').innerHTML = petSVG(S.pet, m === 'normal' ? 'normal' : m, S.pet.acc);
  $('mname').textContent = S.pet.name;
  $('msay').textContent = m === 'normal' ? pick(['¿Jugamos a preguntas? ¡Gana monedas! 🪙', '¡Hola! Te echaba de menos 💜', '¿Me pruebas ropa nueva? 👗']) : moodPhrase();
  $('mcoins').textContent = '🪙 ' + S.coins + ' · ⭐ Nivel ' + level();
  save();
}
function openFull(){ if (B && B.openMundo) B.openMundo(); else { location.hash = ''; location.reload(); } }
window.refresh = function(){ load(); if (MINI) renderMini(); else { updatePet(); renderAll(); } };

/* ======================= arranque ======================= */
function bind(){
  document.querySelector('nav').addEventListener('click', function(e){ var b = e.target.closest('button'); if (b) tab(b.dataset.t); });
  $('actions').addEventListener('click', function(e){ var b = e.target.closest('button'); if (b) action(b.dataset.a); });
  $('scenePet').addEventListener('click', function(){
    if (!S.pet) return;
    if (S.pet.sleeping) { say('Zzz… 😴'); return; }
    S.pet.happy = clamp(S.pet.happy + 1); save(); anim('jump'); setTempMood('celebra', 1200);
    say(pick(['¡Jiji, cosquillas! 😆', '¡Hola, hola! 👋', moodPhrase(), '¡Te quiero mucho! 💜']));
  });
  $('goQuiz').onclick = function(){ tab('quiz'); };
  $('editPet').onclick = function(){ openAdopt(false); };
  $('snd').onclick = function(){ S.sound = !S.sound; save(); renderHeader(); if (!S.sound && B && B.stopSpeak) B.stopSpeak(); toast(S.sound ? '🔊 Voz activada' : '🔇 Voz desactivada'); };
  $('qopts').addEventListener('click', function(e){ var b = e.target.closest('.opt'); if (b) answer(+b.dataset.o); });
  $('qnext').onclick = nextQuestion;
  $('qcats').addEventListener('click', function(e){ var b = e.target.closest('.chip'); if (!b) return; S.qcat = b.dataset.c; save(); renderQCats(); nextQuestion(); });
  $('avcats').addEventListener('click', function(e){ var b = e.target.closest('.chip'); if (!b) return; avCat = b.dataset.c; trying = null; renderAv(); });
  $('avgrid').addEventListener('click', function(e){ var b = e.target.closest('.item'); if (b) tapItem(b.dataset.i); });
  $('buyBtn').onclick = function(){ if (this.dataset.m === 'buy') buyTrying(); else tab('quiz'); };
  $('buyCancel').onclick = function(){ trying = null; renderAv(); };
  $('foodList').addEventListener('click', function(e){ var b = e.target.closest('button'); if (b) buyFood(b.dataset.f); });
  $('paccGrid').addEventListener('click', function(e){ var b = e.target.closest('.item'); if (b) tapPacc(b.dataset.p); });
  $('modalBox').addEventListener('click', function(e){ var b = e.target.closest('#spGrid button'); if (!b) return; var old = SPECIES[chooseSp].name, inp = $('petNameIn'); chooseSp = b.dataset.s; if (inp && (!inp.value.trim() || inp.value.trim() === old)) inp.value = SPECIES[chooseSp].name; renderSp(); });
  $('mini').addEventListener('click', openFull);
  setInterval(function(){ if (!MINI && S.pet) { updatePet(); save(); if (curTab === 'pet' && !tempMood) renderPet(); } }, 30000);
}
load();
if (MINI) { document.body.classList.add('mini'); $('mini').addEventListener('click', openFull); renderMini(); }
else {
  bind();
  updatePet();
  renderAll();
  if (!S.pet) openAdopt(true);
  else say(moodPhrase());
  if (S.lastDaily !== today()) {
    var first = !S.lastDaily;
    S.lastDaily = today(); save();
    setTimeout(function(){ addCoins(30); toast(first ? '🎁 ¡Regalo de bienvenida! +30 🪙' : '🎁 ¡Regalo del día! +30 🪙'); burst(['🪙', '🎁', '✨']); }, 700);
  }
}
