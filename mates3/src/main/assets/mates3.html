<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mates 3</title>
<style>
:root{--bg:#fff7e6;--card:#fff;--ink:#2d2a4a;--accent:#7c5cff;--ok:#1f9d5c;--bad:#e5484d;--board:#1f4d3a;--chalk:#f4f4ef}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;justify-content:center;padding:16px}
.app{width:100%;max-width:560px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;text-align:center;font-size:1.9rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{flex:1 1 30%;padding:10px 6px;border:2px solid var(--accent);background:#fff;color:var(--accent);border-radius:12px;font-weight:700;font-size:1rem;cursor:pointer}
.chips button.active{background:var(--accent);color:#fff}
.chips button:disabled{opacity:.4;cursor:default}
.stats{display:flex;justify-content:space-between;font-weight:600;gap:8px}
.card{background:var(--card);border-radius:18px;padding:20px;box-shadow:0 4px 16px rgba(0,0,0,.08);text-align:center}
.question{font-size:2.4rem;font-weight:800;margin:8px 0 16px}
input{width:100%;max-width:220px;font-size:1.8rem;text-align:center;padding:10px;border:3px solid #ddd;border-radius:12px;color:var(--ink)}
input:focus{outline:none;border-color:var(--accent)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.btn{padding:12px 20px;border:none;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer;color:#fff;background:var(--accent)}
.btn.hint{background:#ffb020;color:var(--ink)}
.btn.sec{background:#e7e4f5;color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.feedback{min-height:50px;margin-top:12px;font-size:1.1rem;font-weight:700}
.feedback.ok{color:var(--ok)}
.feedback.bad{color:var(--bad)}
.hint-box{background:#fff3cc;border-radius:10px;padding:10px;margin-top:8px;font-size:1rem;display:none}
.hint-box.show{display:block}
.board{background:var(--board);border-radius:18px;padding:12px;box-shadow:0 4px 16px rgba(0,0,0,.15)}
.board-head{color:var(--chalk);font-weight:700;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.board-head .tools{display:flex;gap:6px}
.board-head button{padding:6px 12px;border:2px solid var(--chalk);background:transparent;color:var(--chalk);border-radius:10px;font-weight:700;cursor:pointer}
.board-head button.active{background:var(--chalk);color:var(--board)}
canvas{width:100%;height:240px;display:block;touch-action:none;cursor:crosshair;border-radius:10px}
.end{font-size:1.3rem;font-weight:700;margin:10px 0}
#dressSection{display:flex;flex-direction:column;gap:14px}
.stage{border-radius:20px;padding:12px;background:linear-gradient(#1e3a5f,#4b6fa3);box-shadow:0 4px 16px rgba(0,0,0,.15);position:relative;overflow:hidden}
.stage svg{position:relative;width:100%;max-height:420px;display:block}
.panel{background:#fff;border-radius:18px;padding:14px;box-shadow:0 4px 16px rgba(0,0,0,.08);display:flex;flex-direction:column;gap:12px}
.slot h3{margin:0 0 6px;font-size:1rem}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{padding:8px 12px;border:2px solid #d9d4f0;background:#faf9ff;color:var(--ink);border-radius:10px;font-weight:600;font-size:.95rem;cursor:pointer}
.opt.active{border-color:#e5484d;background:#e5484d;color:#fff}
</style>
</head>
<body>
<div class="app">
  <h1>🧮 Mates 3</h1>

  <div class="chips" id="modes">
    <button data-mode="math" class="active">🧮 Mates</button>
    <button data-mode="dress">🎄 Vestir</button>
  </div>

  <div id="mathSection">
  <div class="chips" id="ops">
    <button data-op="mixto" class="active">Mezcla</button>
    <button data-op="suma">Sumar</button>
    <button data-op="resta">Restar</button>
    <button data-op="mult">Multiplicar</button>
    <button data-op="div">Dividir</button>
    <button data-op="tablas">Tablas 1-10</button>
  </div>

  <div class="chips" id="levels">
    <button data-level="facil" class="active">Fácil</button>
    <button data-level="dificil">Difícil</button>
    <button data-level="experto">Experto</button>
  </div>

  <div class="stats">
    <span id="progress"></span>
    <span id="score">Aciertos: 0</span>
  </div>

  <div class="card">
    <div id="play">
      <div class="question" id="question"></div>
      <input type="number" inputmode="numeric" id="answer" placeholder="?" autocomplete="off">
      <div class="row">
        <button class="btn" id="check">Comprobar</button>
        <button class="btn hint" id="hint">💡 Pista</button>
        <button class="btn sec" id="next" disabled>Siguiente ➜</button>
      </div>
      <div class="hint-box" id="hintBox"></div>
      <div class="feedback" id="feedback"></div>
    </div>
    <div id="result" hidden>
      <div class="question">¡Ronda terminada!</div>
      <div class="end" id="endScore"></div>
      <p id="endMsg"></p>
      <div class="row"><button class="btn" id="again">Jugar otra vez</button></div>
    </div>
  </div>

  <div class="board">
    <div class="board-head">
      <span>✏️ Pizarra para cuentas en sucio</span>
      <div class="tools">
        <button id="penBtn" class="active">Tiza</button>
        <button id="eraserBtn">Goma</button>
        <button id="clearBtn">Borrar todo</button>
      </div>
    </div>
    <canvas id="pizarra"></canvas>
  </div>
  </div>

  <div id="dressSection" hidden>
    <div class="chips" id="chars">
      <button data-char="avatar" class="active">🧒 Avatar</button>
      <button data-char="reno">🦌 Reno</button>
    </div>
    <div class="stage">
      <svg id="svg" viewBox="0 0 200 290" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <div class="panel" id="panel"></div>
    <div class="row">
      <button class="btn" id="random">🎲 Aleatorio</button>
      <button class="btn sec" id="reset">Reiniciar</button>
    </div>
  </div>
</div>

<script>
const TOTAL = 10;
const OPS_NAMES = {mixto:'Mezcla', suma:'Sumar', resta:'Restar', mult:'Multiplicar', div:'Dividir', tablas:'Tablas 1-10'};
const LEVEL_NAMES = {facil:'Fácil', dificil:'Difícil', experto:'Experto'};
let op = 'mixto', level = 'facil', qNum = 0, correct = 0, current = null, hintStage = 0, answered = false;

const $ = id => document.getElementById(id);
const rnd = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
const mk = (text, ans, hints) => ({text, ans, hints});
const tens = n => Math.floor(n / 10) * 10;

/* ---------- Mezcla (los tres niveles mezclan operaciones) ---------- */
function genFacil() {
  if (Math.random() < 0.5) {
    const a = rnd(1, 10), b = rnd(1, 10);
    return mk(`${a} + ${b}`, a + b, [
      `Cuenta hacia arriba: empieza en ${a} y suma ${b} de uno en uno.`,
      `${a} + ${b} = ${a} + ${Math.floor(b/2)} + ${b - Math.floor(b/2)}`
    ]);
  }
  const a = rnd(5, 20), b = rnd(1, a);
  return mk(`${a} − ${b}`, a - b, [
    `Empieza en ${a} y cuenta hacia atrás ${b} lugares.`,
    `Piensa: ¿qué número hay que sumarle a ${b} para llegar a ${a}?`
  ]);
}

function genDificil() {
  const r = Math.random();
  if (r < 0.35) {
    const a = rnd(10, 60), b = rnd(10, 40);
    return mk(`${a} + ${b}`, a + b, [
      `Suma primero las decenas y luego las unidades.`,
      `${a} + ${b} = ${a} + ${tens(b)} + ${b % 10}`
    ]);
  }
  if (r < 0.65) {
    const a = rnd(20, 100), b = rnd(1, a);
    return mk(`${a} − ${b}`, a - b, [
      `Resta primero las decenas y después las unidades.`,
      `${a} − ${b} = ${a} − ${tens(b)} − ${b % 10}`
    ]);
  }
  const a = rnd(2, 10), b = rnd(2, 10);
  return mk(`${a} × ${b}`, a * b, [
    `Piensa en ${a} grupos de ${b}, o recuerda la tabla del ${a}.`,
    `${a} × ${b} = ${a} × ${b - 1} + ${a}`
  ]);
}

function genExperto() {
  const r = Math.random();
  if (r < 0.3) {
    const a = rnd(12, 99), b = rnd(2, 9);
    return mk(`${a} × ${b}`, a * b, [
      `Descompón el número: multiplica las decenas y las unidades por separado.`,
      `${a} × ${b} = ${tens(a)} × ${b} + ${a % 10} × ${b}`
    ]);
  }
  if (r < 0.55) {
    const b = rnd(2, 12), q = rnd(2, 20), a = b * q;
    return mk(`${a} ÷ ${b}`, q, [
      `Pregúntate: ¿qué número por ${b} da ${a}?`,
      `Prueba la tabla del ${b} hasta llegar a ${a}.`
    ]);
  }
  if (r < 0.8) {
    const a = rnd(1, 50), b = rnd(2, 9), c = rnd(2, 9);
    return mk(`${a} + ${b} × ${c}`, a + b * c, [
      `Primero haz la multiplicación (va antes que la suma).`,
      `Calcula ${b} × ${c} = ${b * c}, y después suma ${a}.`
    ]);
  }
  const a = rnd(10, 60), b = rnd(1, a - 1), c = rnd(2, 9);
  return mk(`(${a} − ${b}) × ${c}`, (a - b) * c, [
    `Lo que está entre paréntesis se hace primero.`,
    `Calcula ${a} − ${b} = ${a - b}, y luego multiplica por ${c}.`
  ]);
}

/* ---------- Por operación y nivel ---------- */
function genSuma(l) {
  if (l === 'facil') {
    const a = rnd(1, 10), b = rnd(1, 10);
    return mk(`${a} + ${b}`, a + b, [
      `Cuenta hacia arriba desde ${a}, usando los dedos si hace falta.`,
      `${a} + ${b} = ${a} + ${Math.floor(b/2)} + ${b - Math.floor(b/2)}`
    ]);
  }
  if (l === 'dificil') {
    const a = rnd(10, 60), b = rnd(10, 40);
    return mk(`${a} + ${b}`, a + b, [
      `Suma primero las decenas y luego las unidades.`,
      `${a} + ${b} = ${a} + ${tens(b)} + ${b % 10}`
    ]);
  }
  const a = rnd(10, 99), b = rnd(10, 99);
  return mk(`${a} + ${b}`, a + b, [
    `Suma las unidades; si pasan de 9, llevas 1 a las decenas.`,
    `${a} + ${b} = ${tens(a)} + ${tens(b)} + ${a % 10} + ${b % 10}`
  ]);
}

function genResta(l) {
  if (l === 'facil') {
    const a = rnd(1, 20), b = rnd(1, a);
    return mk(`${a} − ${b}`, a - b, [
      `Cuenta hacia atrás desde ${a}, de uno en uno.`,
      `Piensa: ¿qué número hay que sumarle a ${b} para llegar a ${a}?`
    ]);
  }
  if (l === 'dificil') {
    const a = rnd(20, 100), b = rnd(1, a);
    return mk(`${a} − ${b}`, a - b, [
      `Resta primero las decenas y después las unidades.`,
      `${a} − ${b} = ${a} − ${tens(b)} − ${b % 10}`
    ]);
  }
  const a = rnd(100, 999), b = rnd(10, a);
  return mk(`${a} − ${b}`, a - b, [
    `Resta por partes: primero las decenas y luego las unidades.`,
    `${a} − ${b} = ${a} − ${tens(b)} − ${b % 10}`
  ]);
}

function genMult(l) {
  if (l === 'facil') {
    const a = rnd(1, 5), b = rnd(1, 10);
    return mk(`${a} × ${b}`, a * b, [
      `Piensa en ${a} grupos de ${b}, o recuerda la tabla del ${a}.`,
      `${a} × ${b} = ${a} × ${b - 1} + ${a}`
    ]);
  }
  if (l === 'dificil') {
    const a = rnd(6, 12), b = rnd(6, 12);
    return mk(`${a} × ${b}`, a * b, [
      `Usa una tabla que ya sepas y suma o resta ${a} para llegar.`,
      `${a} × ${b} = ${a} × ${b - 1} + ${a}`
    ]);
  }
  const a = rnd(11, 99), b = rnd(2, 9);
  return mk(`${a} × ${b}`, a * b, [
    `Descompón el número: multiplica las decenas y las unidades por separado.`,
    `${a} × ${b} = ${tens(a)} × ${b} + ${a % 10} × ${b}`
  ]);
}

function genDiv(l) {
  if (l === 'facil') {
    const b = rnd(2, 5), q = rnd(1, 10), a = b * q;
    return mk(`${a} ÷ ${b}`, q, [
      `Pregúntate: ¿qué número por ${b} da ${a}?`,
      `Prueba la tabla del ${b} hasta llegar a ${a}.`
    ]);
  }
  if (l === 'dificil') {
    const b = rnd(2, 10), q = rnd(2, 12), a = b * q;
    return mk(`${a} ÷ ${b}`, q, [
      `Pregúntate: ¿qué número por ${b} da ${a}?`,
      `Prueba la tabla del ${b} hasta llegar a ${a}.`
    ]);
  }
  const b = rnd(6, 12), q = rnd(10, 25), a = b * q, qt = tens(q);
  return mk(`${a} ÷ ${b}`, q, [
    `Quita primero una parte grande: busca cuántas veces cabe ${b} en ${a}.`,
    `Prueba ${b} × ${qt} = ${b * qt}; te quedan ${a - b * qt} para dividir.`
  ]);
}

function genTablas() {
  const a = rnd(1, 10), b = rnd(1, 10);
  return mk(`${a} × ${b}`, a * b, [
    `Piensa en ${a} grupos de ${b}, o recuerda la tabla del ${a}.`,
    `${a} × ${b} = ${a} × ${b - 1} + ${a}`
  ]);
}

function generate() {
  if (op === 'tablas') return genTablas();
  if (op === 'mixto') return ({facil: genFacil, dificil: genDificil, experto: genExperto})[level]();
  return ({suma: genSuma, resta: genResta, mult: genMult, div: genDiv})[op](level);
}

/* ---------- Juego ---------- */
function label() {
  return op === 'tablas' ? 'Tablas 1-10' : `${OPS_NAMES[op]} · ${LEVEL_NAMES[level]}`;
}

function newQuestion() {
  current = generate();
  hintStage = 0;
  answered = false;
  $('question').textContent = current.text + ' = ?';
  $('answer').value = '';
  $('answer').disabled = false;
  $('check').disabled = false;
  $('next').disabled = true;
  $('next').textContent = 'Siguiente ➜';
  $('hint').disabled = false;
  $('hint').textContent = '💡 Pista';
  $('hintBox').className = 'hint-box';
  $('hintBox').textContent = '';
  $('feedback').textContent = '';
  $('feedback').className = 'feedback';
  $('progress').textContent = `${label()} · ${qNum + 1} / ${TOTAL}`;
  $('score').textContent = `Aciertos: ${correct}`;
  $('answer').focus();
}

function startRound() {
  qNum = 0;
  correct = 0;
  $('play').hidden = false;
  $('result').hidden = true;
  newQuestion();
}

function check() {
  if (answered || current === null) return;
  const v = $('answer').value.trim();
  if (v === '') return;
  answered = true;
  $('answer').disabled = true;
  $('check').disabled = true;
  $('hint').disabled = true;
  $('next').disabled = false;
  if (Number(v) === current.ans) {
    correct++;
    $('feedback').textContent = '¡Muy bien! 🎉';
    $('feedback').className = 'feedback ok';
  } else {
    $('feedback').textContent = `Casi. La respuesta correcta es ${current.ans}.`;
    $('feedback').className = 'feedback bad';
  }
  $('score').textContent = `Aciertos: ${correct}`;
  if (qNum + 1 === TOTAL) $('next').textContent = 'Ver resultado ➜';
}

function showHint() {
  if (answered || hintStage >= current.hints.length) return;
  const box = $('hintBox');
  box.textContent = '💡 ' + current.hints[hintStage];
  box.className = 'hint-box show';
  hintStage++;
  $('hint').textContent = hintStage < current.hints.length
    ? `💡 Pista (${hintStage}/${current.hints.length})`
    : '💡 Pista (agotada)';
  if (hintStage >= current.hints.length) $('hint').disabled = true;
}

function next() {
  if (!answered) return;
  qNum++;
  if (qNum >= TOTAL) return finish();
  newQuestion();
}

function finish() {
  const msg = correct === TOTAL ? '¡Perfecto! Eres un crack 🏆'
    : correct >= 7 ? '¡Muy bien, sigue así! ⭐'
    : correct >= 4 ? 'Buen trabajo, puedes mejorar 💪'
    : 'Vuelve a intentarlo, ¡tú puedes! 🌱';
  $('endScore').textContent = `${label()}: has acertado ${correct} de ${TOTAL}`;
  $('endMsg').textContent = msg;
  $('play').hidden = true;
  $('result').hidden = false;
  $('progress').textContent = label();
  $('score').textContent = `Aciertos: ${correct}`;
}

function mark(containerId, value, key) {
  document.querySelectorAll(`#${containerId} button`).forEach(b =>
    b.classList.toggle('active', b.dataset[key] === value));
}

document.querySelectorAll('#ops button').forEach(btn => {
  btn.addEventListener('click', () => {
    op = btn.dataset.op;
    mark('ops', op, 'op');
    document.querySelectorAll('#levels button').forEach(b => b.disabled = op === 'tablas');
    startRound();
  });
});

document.querySelectorAll('#levels button').forEach(btn => {
  btn.addEventListener('click', () => {
    level = btn.dataset.level;
    mark('levels', level, 'level');
    startRound();
  });
});

$('check').addEventListener('click', check);
$('hint').addEventListener('click', showHint);
$('next').addEventListener('click', next);
$('again').addEventListener('click', startRound);
$('answer').addEventListener('keydown', e => {
  if (e.key === 'Enter') { answered ? next() : check(); }
});

/* ---------- Pizarra ---------- */
const cv = $('pizarra'), ctx = cv.getContext('2d');
let drawing = false, last = null, tool = 'pen';

function resizeBoard() {
  const img = cv.width ? cv.toDataURL() : null;
  const r = cv.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(r.width * dpr);
  cv.height = Math.round(r.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#f4f4ef';
  if (img) {
    const im = new Image();
    im.onload = () => ctx.drawImage(im, 0, 0, r.width, r.height);
    im.src = img;
  }
}

function pos(e) {
  const r = cv.getBoundingClientRect();
  return {x: e.clientX - r.left, y: e.clientY - r.top};
}

cv.addEventListener('pointerdown', e => {
  drawing = true;
  last = pos(e);
  cv.setPointerCapture(e.pointerId);
});

cv.addEventListener('pointermove', e => {
  if (!drawing) return;
  const p = pos(e);
  ctx.beginPath();
  ctx.moveTo(last.x, last.y);
  ctx.lineTo(p.x, p.y);
  if (tool === 'pen') {
    ctx.globalCompositeOperation = 'source-over';
    ctx.lineWidth = 3;
  } else {
    ctx.globalCompositeOperation = 'destination-out';
    ctx.lineWidth = 24;
  }
  ctx.stroke();
  last = p;
});

['pointerup', 'pointercancel', 'pointerleave'].forEach(ev =>
  cv.addEventListener(ev, () => { drawing = false; }));

$('penBtn').addEventListener('click', () => {
  tool = 'pen';
  $('penBtn').classList.add('active');
  $('eraserBtn').classList.remove('active');
});
$('eraserBtn').addEventListener('click', () => {
  tool = 'eraser';
  $('eraserBtn').classList.add('active');
  $('penBtn').classList.remove('active');
});
$('clearBtn').addEventListener('click', () => {
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.restore();
});

window.addEventListener('resize', resizeBoard);
resizeBoard();

/* ---------- Vístete para Navidad ---------- */
const DRESS_LABELS = {hat:'Gorro / corona', top:'Ropa', extra:'Extra'};
const DRESS = {
  avatar: {
    defaults: {hat:'none', top:'rojo', extra:'none'},
    slots: {
      hat: [{id:'none',name:'Sin gorro'},{id:'papa',name:'Gorro de Papá Noel'},{id:'elfo',name:'Gorro de elfo'},{id:'corona',name:'Corona de acebo'}],
      top: [{id:'rojo',name:'Jersey rojo'},{id:'verde',name:'Jersey verde'},{id:'azul',name:'Jersey azul'},{id:'copos',name:'Jersey de copos'}],
      extra: [{id:'none',name:'Nada'},{id:'gafas',name:'Gafas'},{id:'baston',name:'Bastón de caramelo'},{id:'bufanda',name:'Bufanda'}]
    }
  },
  reno: {
    defaults: {hat:'none', top:'natural', extra:'none'},
    slots: {
      hat: [{id:'none',name:'Sin gorro'},{id:'gorro',name:'Gorro de Papá Noel'},{id:'lazo',name:'Lacito'}],
      top: [{id:'natural',name:'Pelo natural'},{id:'rojo',name:'Rojo con copos'},{id:'verde',name:'Verde con copos'}],
      extra: [{id:'none',name:'Nada'},{id:'bufanda',name:'Bufanda verde'},{id:'cascabel',name:'Cascabel'},{id:'luces',name:'Luces en la cornamenta'}]
    }
  }
};
const dressState = {avatar: {...DRESS.avatar.defaults}, reno: {...DRESS.reno.defaults}};
let dressChar = 'avatar';
const SKIN = '#f5c9a0', HAIR = '#6b3f1d', INK = '#2d2a4a';
const SNOW = [[80,165],[120,162],[100,190],[75,210],[125,212],[100,232],[88,250],[114,248]];
const RSNOW = [[70,180],[90,170],[110,195],[130,178],[100,215],[80,205],[120,210]];

function drawAvatar(s) {
  const shirt = {rojo:'#e5484d', verde:'#1f9d5c', azul:'#3b82f6', copos:'#e5484d'}[s.top];
  const dots = s.top === 'copos'
    ? `<g fill="#fff">${SNOW.map(([x,y]) => `<circle cx="${x}" cy="${y}" r="4"/>`).join('')}</g>` : '';
  const legs = `<rect x="72" y="230" width="22" height="50" rx="10" fill="${INK}"/>
    <rect x="106" y="230" width="22" height="50" rx="10" fill="${INK}"/>`;
  const top = `<rect x="40" y="150" width="24" height="75" rx="12" fill="${shirt}"/>
    <rect x="136" y="150" width="24" height="75" rx="12" fill="${shirt}"/>
    <rect x="62" y="140" width="76" height="100" rx="26" fill="${shirt}"/>
    <circle cx="52" cy="228" r="11" fill="${SKIN}"/>
    <circle cx="148" cy="228" r="11" fill="${SKIN}"/>${dots}`;
  const head = `<circle cx="100" cy="95" r="52" fill="${HAIR}"/>
    <circle cx="100" cy="105" r="44" fill="${SKIN}"/>
    <path d="M56 92 Q60 40 100 42 Q142 42 146 92 Q130 66 100 70 Q72 66 56 92Z" fill="${HAIR}"/>
    <circle cx="85" cy="108" r="5" fill="${INK}"/>
    <circle cx="115" cy="108" r="5" fill="${INK}"/>
    <ellipse cx="78" cy="122" rx="7" ry="4" fill="#ff9aa2" opacity=".6"/>
    <ellipse cx="122" cy="122" rx="7" ry="4" fill="#ff9aa2" opacity=".6"/>
    <path d="M88 124 Q100 136 112 124" stroke="${INK}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  const hats = {
    none: '',
    papa: `<path d="M56 82 Q56 22 104 18 Q150 22 146 84 Q126 66 100 68 Q74 66 56 82Z" fill="#e5484d"/><rect x="48" y="74" width="104" height="18" rx="9" fill="#fff"/><circle cx="146" cy="22" r="12" fill="#fff"/>`,
    elfo: `<path d="M56 80 Q50 20 120 22 Q150 26 150 80Z" fill="#1f9d5c"/><rect x="48" y="72" width="104" height="16" rx="8" fill="#fff"/><circle cx="128" cy="26" r="10" fill="#fff"/>`,
    corona: `<path d="M60 70 L68 40 L84 58 L100 32 L116 58 L132 40 L140 70Z" fill="#ffd166" stroke="#e0a800" stroke-width="2"/><circle cx="68" cy="40" r="5" fill="#e5484d"/><circle cx="100" cy="32" r="5" fill="#e5484d"/><circle cx="132" cy="40" r="5" fill="#e5484d"/>`
  };
  const extras = {
    none: '',
    gafas: `<g fill="none" stroke="${INK}" stroke-width="3"><circle cx="85" cy="108" r="11"/><circle cx="115" cy="108" r="11"/><line x1="96" y1="108" x2="104" y2="108"/></g>`,
    baston: `<path d="M170 225 V170 Q170 150 186 150 Q200 150 200 166" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round"/><path d="M170 225 V170 Q170 150 186 150 Q200 150 200 166" fill="none" stroke="#e5484d" stroke-width="10" stroke-dasharray="8 8"/>`,
    bufanda: `<rect x="66" y="136" width="68" height="16" rx="8" fill="#ffd166"/><rect x="118" y="146" width="16" height="36" rx="6" fill="#ffd166"/>`
  };
  return legs + top + head + hats[s.hat] + extras[s.extra];
}

function drawReno(s) {
  const body = s.top === 'natural' ? '#8b5a2b' : s.top === 'rojo' ? '#e5484d' : '#1f9d5c';
  const dots = s.top === 'natural' ? ''
    : `<g fill="#fff">${RSNOW.map(([x,y]) => `<circle cx="${x}" cy="${y}" r="4"/>`).join('')}</g>`;
  const tail = `<circle cx="38" cy="168" r="10" fill="#fff"/>`;
  const legs = `<rect x="58" y="205" width="14" height="66" rx="7" fill="#6b3f1d"/>
    <rect x="78" y="205" width="14" height="66" rx="7" fill="#6b3f1d"/>
    <rect x="118" y="205" width="14" height="66" rx="7" fill="#6b3f1d"/>
    <rect x="138" y="205" width="14" height="66" rx="7" fill="#6b3f1d"/>`;
  const top = `<ellipse cx="100" cy="180" rx="62" ry="40" fill="${body}"/>
    <path d="M118 150 L138 100 L160 110 L150 170 Z" fill="${body}"/>${dots}`;
  const head = `<ellipse cx="128" cy="76" rx="10" ry="5" transform="rotate(-20 128 76)" fill="#8b5a2b"/>
    <ellipse cx="150" cy="92" rx="30" ry="26" fill="#8b5a2b"/>
    <ellipse cx="176" cy="102" rx="14" ry="11" fill="#d8a06a"/>
    <circle cx="188" cy="98" r="6" fill="#e5484d"/>
    <circle cx="156" cy="86" r="4.5" fill="${INK}"/>
    <circle cx="157" cy="84" r="1.5" fill="#fff"/>`;
  const antlers = `<path d="M144 70 L132 40 M132 40 L120 32 M132 40 L128 20 M150 68 L162 40 M162 40 L172 32 M162 40 L166 20" stroke="#6b3f1d" stroke-width="5" stroke-linecap="round" fill="none"/>`;
  const hats = {
    none: '',
    gorro: `<path d="M122 72 Q134 36 180 50 Q162 60 170 74 Z" fill="#e5484d"/><rect x="118" y="68" width="58" height="10" rx="5" fill="#fff"/><circle cx="180" cy="50" r="7" fill="#fff"/>`,
    lazo: `<path d="M146 62 L134 52 L134 72 Z M146 62 L158 52 L158 72 Z" fill="#e5484d"/><circle cx="146" cy="62" r="4" fill="#b02a2f"/>`
  };
  const extras = {
    none: '',
    bufanda: `<path d="M118 150 Q140 166 166 150 L168 162 Q140 178 116 162 Z" fill="#1f9d5c"/>`,
    cascabel: `<circle cx="128" cy="168" r="7" fill="#ffd166" stroke="#b8860b" stroke-width="2"/>`,
    luces: `<circle cx="132" cy="40" r="3.5" fill="#ffd166"/><circle cx="162" cy="40" r="3.5" fill="#5ce1e6"/><circle cx="120" cy="32" r="3.5" fill="#ff9aa2"/><circle cx="172" cy="32" r="3.5" fill="#ffd166"/>`
  };
  return tail + legs + top + head + antlers + hats[s.hat] + extras[s.extra];
}

function renderDress() {
  const s = dressState[dressChar];
  $('svg').innerHTML = dressChar === 'avatar' ? drawAvatar(s) : drawReno(s);
  document.querySelectorAll('#chars button').forEach(b => b.classList.toggle('active', b.dataset.char === dressChar));
  const slots = DRESS[dressChar].slots;
  $('panel').innerHTML = Object.keys(slots).map(slot => `
    <div class="slot">
      <h3>${DRESS_LABELS[slot]}</h3>
      <div class="opts">
        ${slots[slot].map(o => `<button class="opt ${s[slot] === o.id ? 'active' : ''}" data-slot="${slot}" data-id="${o.id}">${o.name}</button>`).join('')}
      </div>
    </div>`).join('');
}

document.querySelectorAll('#chars button').forEach(b => b.addEventListener('click', () => {
  dressChar = b.dataset.char;
  renderDress();
}));

$('panel').addEventListener('click', e => {
  const b = e.target.closest('.opt');
  if (!b) return;
  dressState[dressChar][b.dataset.slot] = b.dataset.id;
  renderDress();
});

$('random').addEventListener('click', () => {
  const slots = DRESS[dressChar].slots;
  Object.keys(slots).forEach(slot => {
    const opts = slots[slot];
    dressState[dressChar][slot] = opts[Math.floor(Math.random() * opts.length)].id;
  });
  renderDress();
});

$('reset').addEventListener('click', () => {
  dressState[dressChar] = {...DRESS[dressChar].defaults};
  renderDress();
});

/* ---------- Cambio entre Mates y Vestir ---------- */
function setMode(m) {
  const dress = m === 'dress';
  $('mathSection').hidden = dress;
  $('dressSection').hidden = !dress;
  document.querySelectorAll('#modes button').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
  if (dress) renderDress(); else resizeBoard();
}
document.querySelectorAll('#modes button').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));

/* ---------- Arranque ---------- */
startRound();
</script>
</body>
</html>
